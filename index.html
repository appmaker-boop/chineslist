<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChinesList - GD Level List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="stars-container"></div>

    <header class="header">
        <div class="logo-area">
            <h1>ChinesList</h1>
            <span class="subtitle">Geometry Dash Demon List</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn plus-btn" id="openModalBtn" title="Add Level">➕</button>
            <button class="icon-btn rainbow-btn hidden" id="adminModalBtn" title="Admin Add Level">🌈➕</button>
        </div>
    </header>

    <main class="main-container">
        <!-- Category Carousel Navigation -->
        <section class="category-carousel-section">
            <div class="carousel-nav-container">
                <button class="carousel-arrow" id="prevCatBtn" title="Previous List">&#10094;</button>
                <div class="carousel-label-wrapper">
                    <h2 id="categoryTitle">Main List</h2>
                </div>
                <button class="carousel-arrow" id="nextCatBtn" title="Next List">&#10095;</button>
            </div>
            <p id="categoryDescription" class="carousel-description">The hardest demons in Geometry Dash (Top 1 - 14).</p>
        </section>

        <section class="levels-section">
            <div id="levelsContainer" class="levels-grid"></div>
        </section>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Level Request</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="levelForm" class="level-form">
                <div class="input-group" id="positionGroup" style="display: none;">
                    <label>Placement Position (e.g., 1 for Top 1)</label>
                    <input type="number" id="levelPosition" min="1" placeholder="1">
                    <button type="button" class="apply-field-btn">Apply</button>
                </div>
                <div class="input-group">
                    <label>Level Name</label>
                    <input type="text" id="levelName" required placeholder="e.g., Slaughterhouse">
                    <button type="button" class="apply-field-btn">Apply</button>
                </div>
                <div class="input-group">
                    <label>Duration</label>
                    <input type="text" id="levelDuration" required placeholder="e.g., 1m 30s">
                    <button type="button" class="apply-field-btn">Apply</button>
                </div>
                <div class="input-group">
                    <label>Creator (Must be logged in)</label>
                    <input type="text" id="levelCreator" required placeholder="Your GD Username">
                    <button type="button" class="apply-field-btn">Apply</button>
                </div>
                <div class="input-group">
                    <label>Verifier (Must be logged in)</label>
                    <input type="text" id="levelVerifier" required placeholder="Verifier Username">
                    <button type="button" class="apply-field-btn">Apply</button>
                </div>
                <div class="input-group">
                    <label>YouTube Link (Proof)</label>
                    <input type="url" id="levelYT" required placeholder="https://youtube.com/watch?v=...">
                    <button type="button" class="apply-field-btn">Apply</button>
                </div>
                <button type="submit" class="submit-request-btn" id="submitFormBtn">Submit Request</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
